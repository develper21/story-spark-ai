[build]
  command = "npm run build -w story-spark-ai-frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  VITE_BASE_URL = "https://storyspark-service.onrender.com/api/v1"
  VITE_SOCKET_URL = "https://storyspark-service.onrender.com"

# Proxy API calls directly to Render backend
[[redirects]]
  from = "/api/v1/*"
  to = "https://storyspark-service.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://storyspark-service.onrender.com/api/v1/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
